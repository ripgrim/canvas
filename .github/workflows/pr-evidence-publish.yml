name: Publish PR evidence

on:
  workflow_run:
    workflows:
      - PR evidence
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: publish-pr-evidence-${{ github.event.workflow_run.pull_requests[0].number }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish interaction evidence
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.event.workflow_run.pull_requests[0].base.ref == 'main' && 'production' || 'staging' }}
    steps:
      - name: Check out trusted publisher
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.6.2

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install trusted dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate upstream artifact metadata
        id: artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/pr-evidence-artifact.mjs
          --repository "${{ github.repository }}"
          --run-id "${{ github.event.workflow_run.id }}"
          --run-attempt "${{ github.event.workflow_run.run_attempt }}"

      - name: Download exact evidence artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ steps.artifact.outputs.artifact-id }}
          path: outputs/pr-evidence/download
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Build trusted publisher
        run: pnpm --filter @canvas/pr-evidence build

      - name: Publish verified evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_EVIDENCE_BUCKET: comp-canvas-pr-evidence
          PR_EVIDENCE_MEDIA_ORIGIN: https://evidence.canvas.ripgrim.com
        run: >-
          node scripts/pr-evidence-publish.mjs
          --repository-id "${{ github.repository_id }}"
          --repository "${{ github.repository }}"
          --pull-request "${{ github.event.workflow_run.pull_requests[0].number }}"
          --run-id "${{ github.event.workflow_run.id }}"
          --run-attempt "${{ github.event.workflow_run.run_attempt }}"
