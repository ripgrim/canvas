name: Update rollout

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Update channel
        required: true
        type: choice
        options:
          - staging
          - production
      percentage:
        description: Eligible installations, 0 pauses and 100 completes
        required: true
        type: number

permissions:
  contents: read

jobs:
  rollout:
    name: Set ${{ inputs.environment }} rollout to ${{ inputs.percentage }} percent
    if: github.actor == 'ripgrim'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.6.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate rollout input
        env:
          PERCENTAGE: ${{ inputs.percentage }}
        shell: bash
        run: node -e "const value=Number(process.env.PERCENTAGE); if (!Number.isInteger(value) || value < 0 || value > 100) throw new Error('Percentage must be an integer from 0 to 100.')"

      - name: Advance or pause rollout
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          UPDATE_BUCKET: ${{ vars.UPDATE_BUCKET }}
          PERCENTAGE: ${{ inputs.percentage }}
          MANIFEST: ${{ inputs.environment == 'staging' && 'nightly.yml' || 'latest.yml' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$UPDATE_BUCKET"
          pnpm --filter @canvas/update-service exec wrangler r2 object get "$UPDATE_BUCKET/windows/x64/$MANIFEST" --file manifest.yml --remote
          node scripts/update-manifest.mjs rollout manifest.yml "$PERCENTAGE"
          pnpm --filter @canvas/update-service exec wrangler r2 object put "$UPDATE_BUCKET/windows/x64/$MANIFEST" --file manifest.yml --content-type "text/yaml; charset=utf-8" --remote
